services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: examinator
      POSTGRES_PASSWORD: examinator
      POSTGRES_DB: examinator
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Eseguito solo alla prima creazione del volume. Per rigenerare lo schema:
      # docker compose down -v && docker compose up
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examinator -d examinator"]
      interval: 3s
      timeout: 3s
      retries: 20

  importer:
    build:
      context: .
      dockerfile: importer/Dockerfile
    environment:
      DATABASE_URL: postgresql://examinator:examinator@db:5432/examinator
      PDF_PATH: /data/questions.pdf
      IMAGES_DIR: /data/images
    volumes:
      # Le immagini ritagliate dal PDF vivono qui. Il volume e' condiviso: il
      # backend lo montera' in sola lettura per servirle come file statici.
      - question_images:/data/images
    depends_on:
      db:
        condition: service_healthy
    # Job una tantum: gira, popola le tabelle ed esce.
    restart: "no"

  # Client SQL via browser su http://localhost:8081, niente da installare.
  # Non parte con 'docker compose up': si avvia a richiesta con
  #   docker compose --profile dev up -d pgweb
  #   docker compose --profile dev stop pgweb 
  pgweb:
    image: sosedoff/pgweb:latest
    #profiles: ["dev"]
    environment:
      # sslmode=disable: dentro la rete del compose il DB non espone TLS.
      PGWEB_DATABASE_URL: postgresql://examinator:examinator@db:5432/examinator?sslmode=disable
    # --lock-session aggancia la sessione del browser alla connessione aperta
    # all'avvio. Senza, pgweb la tiene separata e presenta il form di login
    # anche avendo gia' l'URL del database.
    command: ["--bind=0.0.0.0", "--listen=8081", "--lock-session"]
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  question_images:
